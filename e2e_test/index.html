<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageRoute - Smart Image Routing for a Smarter Workplace</title>
    <meta name="description" content="Right Image. Right Department. Always. Upload documents or images and let AI route them to the right team — securely, quickly, and effortlessly.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fff9ed',
                100: '#ffefd2',
                200: '#ffdda6',
                300: '#ffc570',
                400: '#FFB45C',
                500: '#F59E42',
                600: '#e58525',
                700: '#be6519',
                800: '#97501b',
                900: '#7a421a',
              },
              darkBlack: '#070605',
              secondaryBg: '#0D0907',
              deepBrown: '#100B08',
              panelBg: 'rgba(20, 13, 9, 0.72)',
              panelBgHover: 'rgba(29, 18, 11, 0.85)',
              primaryAccent: '#F59E42',
              brightAccent: '#FFB45C',
              darkAmber: '#9A5B25',
              textPrimary: '#F5F5F5',
              textSecondary: '#A8A29E',
              textMuted: '#77706A',
              borderAmber: 'rgba(245, 158, 66, 0.20)',
              borderStrongAmber: 'rgba(245, 158, 66, 0.45)',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', -apple-system, 'Segoe UI', 'Roboto', 'sans-serif'],
              script: ['Caveat', 'cursive'],
              serif: ['Instrument Serif', 'Georgia', 'serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #070605;
            color: #F5F5F5;
            min-height: 100vh;
        }
        /* Custom scrollbar matching dark cinematic theme */
        ::-webkit-scrollbar {
          width: 6px;
          height: 6px;
        }
        ::-webkit-scrollbar-track {
          background: #070605;
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(245, 158, 66, 0.2);
          border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: rgba(245, 158, 66, 0.35);
        }
        @keyframes floatSlow {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-7px) rotate(0.8deg); }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.35; transform: scale(1); }
          50% { opacity: 0.65; transform: scale(1.04); }
        }
        @keyframes pageFadeIn {
          0% { opacity: 0; transform: translateY(6px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes clickRipple {
          0% { transform: scale(0.2); opacity: 0.8; }
          100% { transform: scale(3.5); opacity: 0; }
        }
        @keyframes pulseExpand {
          0% { transform: scale(0.4); opacity: 0.8; }
          100% { transform: scale(2.5); opacity: 0; }
        }
        .animate-float-slow {
          animation: floatSlow 6s ease-in-out infinite;
        }
        .animate-pulse-glow {
          animation: pulseGlow 4s ease-in-out infinite;
        }
        .page-enter {
          animation: pageFadeIn 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#070605] text-[#F5F5F5] antialiased selection:bg-[#F59E42]/30 selection:text-[#FFB45C]">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
